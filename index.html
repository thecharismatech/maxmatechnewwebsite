    <style>
      html {
        background: #05050a;
      }

      #webgl-canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background:
          radial-gradient(60% 55% at 22% 12%, rgba(139, 92, 246, 0.16), transparent 70%),
          radial-gradient(55% 50% at 82% 78%, rgba(34, 211, 238, 0.12), transparent 72%),
          radial-gradient(70% 60% at 50% 50%, rgba(217, 70, 239, 0.06), transparent 75%);
      }

      #root {
        position: relative;
        z-index: 1;
      }

      #webgl-vignette {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(
            120% 90% at 50% 45%,
            transparent 40%,
            rgba(5, 5, 10, 0.55) 82%,
            rgba(5, 5, 10, 0.9) 100%
          ),
          linear-gradient(
            180deg,
            rgba(5, 5, 10, 0.35),
            transparent 22%,
            transparent 74%,
            rgba(5, 5, 10, 0.55)
          );
      }
    </style>
  </head>
