      rel="stylesheet"

    <style>
      html {
        background: #05050a;
      }

      #webgl-canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.62;
        background:
          radial-gradient(58% 52% at 20% 10%, rgba(88, 72, 158, 0.15), transparent 70%),
          radial-gradient(52% 48% at 84% 80%, rgba(30, 92, 108, 0.12), transparent 72%),
          radial-gradient(70% 60% at 50% 50%, rgba(96, 44, 120, 0.07), transparent 75%);
      }

      #root {
        position: relative;
        z-index: 2;
      }

      /* Voile de lecture : the lattice stays as texture, never as content.
         Two clear windows keep the opening and the closing luminous. */
      #webgl-scrim {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(58% 34% at 50% 4%, rgba(6, 6, 13, 0.24), rgba(6, 6, 13, 0.84) 78%),
          radial-gradient(58% 30% at 50% 97%, rgba(6, 6, 13, 0.3), rgba(6, 6, 13, 0.86) 78%),
          linear-gradient(
            180deg,
            rgba(6, 6, 13, 0.62),
            rgba(6, 6, 13, 0.87) 18%,
            rgba(6, 6, 13, 0.87) 82%,
            rgba(6, 6, 13, 0.64)
          );
      }

      #webgl-vignette {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(
            120% 90% at 50% 45%,
            transparent 44%,
            rgba(5, 5, 10, 0.5) 84%,
            rgba(5, 5, 10, 0.86) 100%
          ),
          linear-gradient(
            180deg,
            rgba(5, 5, 10, 0.34),
            transparent 24%,
            transparent 76%,
            rgba(5, 5, 10, 0.5)
          );
      }
    </style>
  </head>
  <body>
    <canvas id="webgl-canvas" aria-hidden="true"></canvas>
    <div id="webgl-scrim" aria-hidden="true"></div>
    <div id="webgl-vignette" aria-hidden="true"></div>
    <div id="root"></div>
